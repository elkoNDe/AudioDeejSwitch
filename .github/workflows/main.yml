name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: true

      - name: Install Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev libwebkit2gtk-4.0-dev

      - name: Run tests
        run: go test -race ./... -count=1

  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: true

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./package.ps1

      - name: Sign artifacts (optional)
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERT_BASE64) {
            Write-Host "WINDOWS_SIGNING_CERT_BASE64 not set; skipping signing."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'AudioDeejSwitch.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          $targets = @((Resolve-Path '.\AudioDeejSwitch.exe').Path)
          $targets += (Get-ChildItem '.\dist\AudioDeejSwitch_Setup_*.exe').FullName
          foreach ($target in $targets) {
            & $signtool.FullName sign /f $pfx /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $target" }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AudioDeejSwitch-windows-amd64
          path: |
            AudioDeejSwitch.exe
            dist/AudioDeejSwitch_Setup_*.exe
          if-no-files-found: error
